<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event — Kitaab</title>
<meta name="description" content="Event details on Kitaab.">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23C9741A'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='white' font-family='Georgia'%3E%E0%A4%95%3C/text%3E%3C/svg%3E">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header" data-active="events"></div>

<main id="main">
<section class="section">
  <div class="wrap" style="max-width:820px">
    <div id="detail"><p class="muted">Loading event…</p></div>
  </div>
</section>
</main>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const id = new URLSearchParams(location.search).get("id");
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function notFound(msg) {
    $('detail').innerHTML = `<div class="panel center" style="max-width:460px;margin:40px auto">
      <h2 class="mt-0">${msg || "Event not found"}</h2>
      <p class="muted">This event may have been removed, or the link is incorrect.</p>
      <a class="btn btn--primary btn--sm" href="events.html">Browse all events</a></div>`;
  }

  (async function () {
    const enabled = await AUTH.ready;
    if (!enabled) { notFound("Backend not connected"); return; }
    if (!id) { notFound("No event specified"); return; }
    const e = await AUTH.getEvent(id);
    if (!e) { notFound(); return; }
    document.title = `${e.title} — Kitaab`;

    const d = new Date(e.event_date + "T00:00:00");
    const dateStr = `${d.getDate()} ${MONTHS[d.getMonth()] || ""} ${d.getFullYear()}`;
    const loc = e.format
      ? (e.format === "Online" ? "Online"
        : e.format === "Hybrid" ? ("Hybrid" + (e.venue ? " · " + e.venue : ""))
        : (e.venue || "In-person"))
      : (e.mode || "");
    const banner = e.image_url
      ? `<div class="event-hero" style="background-image:url('${esc(e.image_url)}')"></div>`
      : "";
    const link = e.link_url
      ? `<a class="btn btn--teal" href="${esc(e.link_url)}" target="_blank" rel="noopener noreferrer">Register / Join ↗</a>`
      : "";

    // RSVP counts + my status
    const [stats, mine] = await Promise.all([AUTH.rsvpStats(), AUTH.myRsvps()]);
    const s = stats[id] || {};
    const counts = { coming: s.coming || 0, maybe: s.maybe || 0, interested: s.interested || 0 };
    const my = mine[id] || null;
    const rb = (st, label, emoji) => `<button class="rsvp-btn ${my === st ? "active" : ""}" data-status="${st}" type="button">${emoji} ${label} <span class="c">${counts[st]}</span></button>`;

    $('detail').innerHTML = `
      <p class="breadcrumb"><a href="events.html">Events</a> › ${esc(e.title)}</p>
      ${banner}
      <span class="event__type">${esc(e.type)}</span>
      <h1 style="margin:.15em 0 .3em">${esc(e.title)}</h1>
      <div class="event-facts">
        <div><span class="k">📅 Date</span><span class="v">${dateStr}</span></div>
        ${e.event_time ? `<div><span class="k">🕒 Time</span><span class="v">${esc(e.event_time)}</span></div>` : ""}
        <div><span class="k">📍 Where</span><span class="v">${esc(loc)}</span></div>
        <div><span class="k">✍ Host</span><span class="v">${esc(e.host_name)}</span></div>
      </div>
      ${link ? `<div style="margin:6px 0 18px">${link}</div>` : ""}
      ${e.description ? `<div class="flow" style="max-width:64ch"><h3>About this event</h3><p style="white-space:pre-wrap">${esc(e.description)}</p></div>` : `<p class="muted">No further details added.</p>`}
      <hr class="divider" style="margin:28px 0 20px">
      <h3 class="mt-0">Are you going?</h3>
      <div class="rsvp" data-event="${esc(id)}">${rb("coming", "Coming", "✅")}${rb("maybe", "Maybe", "🤔")}${rb("interested", "Interested", "⭐")}</div>
      ${!AUTH.user() ? `<p class="muted" style="margin-top:10px;font-size:.9rem"><a href="signin.html">Sign in</a> to RSVP.</p>` : ""}`;
  })();
</script>
</body>
</html>
