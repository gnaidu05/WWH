name: Deploy Kalam to GitHub Pages

on:
  push:
    branches: ["claude/the-agency-ai-specialists-tccrtq"]
  workflow_dispatch:

# Least-privilege token: read the repo, write to Pages, mint the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys race; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true turns Pages on via the API on first run, so no manual
        # Settings toggle is needed as long as Actions is allowed to manage Pages.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage the site
        # Publish the full multi-page site: all pages plus the assets/ folder
        # (CSS + JS). A copy of the landing page doubles as the 404 fallback.
        run: |
          mkdir -p _site
          cp *.html _site/
          cp -r assets _site/assets
          cp index.html _site/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
