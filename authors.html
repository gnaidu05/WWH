<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authors — Kitaab marketplace</title>
<meta name="description" content="Meet Indian authors across languages and genres. Follow them, read their books, and join their events.">
<link rel="stylesheet" href="assets/css/styles.css?v=12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23D65F43'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='white' font-family='Georgia'%3E%E0%A4%95%3C/text%3E%3C/svg%3E">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header" data-active="authors"></div>

<main id="main">
<section class="page-hero">
  <div class="wrap">
    <p class="eyebrow">The community</p>
    <h1>Meet India's authors</h1>
    <p class="lead">Novelists, poets, storytellers and non-fiction writers — from every corner of the country and every language.</p>
    <div style="margin-top:20px" id="authorsCta"><a class="btn btn--primary" href="join.html">Start your author page →</a></div>
  </div>
</section>

<section class="section--tight section">
  <div class="wrap">
    <div class="toolbar">
      <input id="authorSearch" class="search-input" type="search" placeholder="Search by name or role…" aria-label="Search authors">
    </div>
    <div class="chips" id="authorGenreChips" style="margin-bottom:22px">
      <button class="chip active" data-val="All">All</button>
      <button class="chip" data-val="Fiction">Fiction</button>
      <button class="chip" data-val="Poetry">Poetry</button>
      <button class="chip" data-val="Mystery">Mystery</button>
      <button class="chip" data-val="Business">Business</button>
      <button class="chip" data-val="Children">Children</button>
      <button class="chip" data-val="Memoir">Memoir</button>
      <button class="chip" data-val="Hindi">Hindi</button>
      <button class="chip" data-val="Tamil">Tamil</button>
    </div>
    <p class="result-count" id="authorCount"></p>
    <div class="grid grid--4" id="authorGrid"></div>
  </div>
</section>
</main>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js?v=12"></script>
<script src="assets/js/data.js?v=12"></script>
<script src="assets/js/main.js?v=12"></script>
<script src="assets/js/components.js?v=12"></script>
<script src="assets/js/auth.js?v=12"></script>
<script src="assets/js/filters.js?v=12"></script>
<script src="assets/js/live.js?v=12"></script>
<script>
  // Tailor the hero call-to-action to who's viewing.
  AUTH.ready.then(function (enabled) {
    if (!enabled) return;
    const cta = document.getElementById('authorsCta');
    if (!cta || !AUTH.user()) return;
    const p = AUTH.profile() || {};
    if (p.role === 'Author') {
      cta.innerHTML =
        `<a class="btn btn--primary" href="dashboard.html">Go to your dashboard →</a>` +
        `<a class="btn btn--ghost" href="author.html?id=${encodeURIComponent(AUTH.user().id)}" style="margin-left:10px">View your author page</a>`;
    } else {
      cta.innerHTML = `<a class="btn btn--primary" href="dashboard.html">Become an author →</a>`;
    }
  });
</script>
</body>
</html>
