<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book — Kitaab</title>
<meta name="description" content="Book details on Kitaab.">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23C9741A'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='white' font-family='Georgia'%3E%E0%A4%95%3C/text%3E%3C/svg%3E">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header" data-active="books"></div>

<main id="main">
<section class="section">
  <div class="wrap">
    <div id="detail"><p class="muted">Loading book…</p></div>
  </div>
</section>
</main>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const params = new URLSearchParams(location.search);
  const id = params.get("id");

  function notFound(msg) {
    $('detail').innerHTML = `<div class="panel center" style="max-width:460px;margin:40px auto">
      <h2 class="mt-0">${msg || "Book not found"}</h2>
      <p class="muted">This book may have been removed, or the link is incorrect.</p>
      <a class="btn btn--primary btn--sm" href="books.html">Browse all books</a></div>`;
  }

  (async function () {
    const enabled = await AUTH.ready;
    if (!enabled) { notFound("Backend not connected"); return; }
    if (!id) { notFound("No book specified"); return; }
    const b = await AUTH.getBook(id);
    if (!b) { notFound(); return; }

    document.title = `${b.title} — Kitaab`;
    const cover = b.cover_url
      ? `background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.6)),url('${esc(b.cover_url)}') center/cover no-repeat`
      : `background:${COVER_GRADS[b.cover_idx || 0]}`;
    const urls = (b.buy_urls && b.buy_urls.length) ? b.buy_urls : (b.buy_url ? [b.buy_url] : []);
    const buy = urls.length
      ? `<div style="display:flex;flex-direction:column;gap:8px;max-width:320px;margin-top:6px">` +
          urls.map(u => `<a class="btn btn--primary btn--block" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Buy on ${esc(storeName(u))} ↗</a>`).join("") +
        `</div>`
      : `<p class="muted" style="margin-top:6px">No marketplace links added yet.</p>`;

    $('detail').innerHTML = `
      <p class="breadcrumb"><a href="books.html">Books</a> › ${esc(b.title)}</p>
      <div class="detail-grid">
        <div class="detail-cover" style="${cover}">
          <span class="lang-tag">${esc(b.language)}</span>
          <div><h2>${esc(b.title)}</h2><span class="by">by ${esc(b.author_name)}</span></div>
        </div>
        <div>
          <div class="detail-chips"><span class="genre-chip">${esc(b.genre)}</span><span class="genre-chip">${esc(b.language)}</span>${b.isbn ? `<span class="genre-chip">ISBN ${esc(b.isbn)}</span>` : ""}</div>
          <h1 style="margin:.15em 0 .1em">${esc(b.title)}</h1>
          <p class="muted" style="margin:0 0 12px">by <strong>${esc(b.author_name)}</strong></p>
          <div id="detailRating" style="margin:2px 0 10px"></div>
          <p class="detail-price">₹${esc(b.price)}</p>
          ${b.description ? `<p style="max-width:60ch">${esc(b.description)}</p>` : `<p class="muted">No description added.</p>`}
          ${buy}
        </div>
      </div>
      <div id="reviewsBlock"></div>
      <div id="authorBlock"></div>
      <div id="moreBlock"></div>`;

    renderReviews(b);

    // About the author
    const prof = await AUTH.getProfile(b.author_id);
    if (prof) {
      const av = prof.avatar_url
        ? `<div class="avatar" style="width:64px;height:64px;background:url('${esc(prof.avatar_url)}') center/cover no-repeat"></div>`
        : `<div class="avatar" style="width:64px;height:64px;background:${COVER_GRADS[0]}">${esc(initials(prof.full_name || "?"))}</div>`;
      $('authorBlock').innerHTML = `
        <hr class="divider" style="margin:36px 0 26px">
        <h2>About the author</h2>
        <div class="card" style="display:flex;gap:16px;align-items:flex-start;max-width:640px">
          ${av}
          <div><div class="author__name">${esc(prof.full_name)}</div>
          <div class="author__role">${esc(prof.role)}</div>
          ${prof.bio ? `<p class="muted" style="margin:8px 0 0">${esc(prof.bio)}</p>` : ""}</div>
        </div>`;
    }

    // More by this author
    const more = (await AUTH.booksByAuthor(b.author_id)).filter(x => x.id !== b.id);
    if (more.length) {
      $('moreBlock').innerHTML = `<hr class="divider" style="margin:36px 0 26px">
        <h2>More by ${esc(b.author_name)}</h2>
        <div class="grid grid--4">` +
        more.slice(0, 4).map(x => KALAM.bookCard({
          id: x.id, title: x.title, author: x.author_name, genre: x.genre, lang: x.language,
          price: x.price, rating: 0, ratingCount: 0, cover: x.cover_idx || 0, coverUrl: x.cover_url || null,
          isbn: x.isbn || null,
          buyUrls: (x.buy_urls && x.buy_urls.length) ? x.buy_urls : (x.buy_url ? [x.buy_url] : []),
        })).join("") + `</div>`;
    }
  })();

  function fmtDate(s){ try { return new Date(s).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); } catch(e){ return ''; } }

  async function renderReviews(book) {
    const bookId = book.id;
    const reviews = await AUTH.listReviews(bookId);
    const count = reviews.length;
    const avg = count ? reviews.reduce((s,r)=>s+r.rating,0)/count : 0;

    const dr = $('detailRating');
    if (dr) dr.innerHTML = count
      ? `<span class="stars" style="font-size:1.05rem">${stars(Math.round(avg))}</span> <strong>${avg.toFixed(1)}</strong> <span class="muted">· ${count} review${count>1?'s':''}</span>`
      : `<span class="muted">No ratings yet</span>`;

    const me = await AUTH.myReview(bookId);
    let formHtml;
    if (!AUTH.user()) {
      formHtml = `<div class="panel"><p class="muted mb-0">Want to review this book? <a href="signin.html">Sign in</a> or <a href="join.html">join free</a> to leave a rating.</p></div>`;
    } else {
      formHtml = `<div class="panel">
        <h3 class="mt-0">${me ? 'Your review' : 'Write a review'}</h3>
        <div class="star-input" id="starInput" role="radiogroup" aria-label="Your rating">
          ${[1,2,3,4,5].map(v=>`<span class="st" data-v="${v}" role="radio" tabindex="0" aria-label="${v} star">&#9733;</span>`).join('')}
        </div>
        <div class="field" style="margin-top:12px"><textarea id="rvBody" rows="3" placeholder="Share what you thought (optional)"></textarea></div>
        <p id="rvErr" class="hidden" style="color:var(--maroon);font-weight:600;margin:0 0 10px"></p>
        <div style="display:flex;gap:10px">
          <button class="btn btn--primary" id="rvSubmit">${me ? 'Update review' : 'Post review'}</button>
          ${me ? '<button class="btn btn--ghost" id="rvDelete">Delete</button>' : ''}
        </div>
      </div>`;
    }

    const listHtml = count
      ? `<div style="margin-top:22px">` + reviews.map(r=>`
          <div class="review">
            <div class="review__head"><span class="review__who">${esc(r.reviewer_name)}</span>
              <span><span class="stars">${stars(r.rating)}</span> <span class="review__date">${fmtDate(r.created_at)}</span></span></div>
            ${r.body ? `<p class="review__body">${esc(r.body)}</p>` : ''}
          </div>`).join('') + `</div>`
      : `<p class="muted" style="margin-top:16px">No reviews yet — be the first.</p>`;

    $('reviewsBlock').innerHTML = `
      <hr class="divider" style="margin:36px 0 24px">
      <h2>Reviews${count?` <span class="muted" style="font-size:1rem">(${count})</span>`:''}</h2>
      ${formHtml}
      ${listHtml}`;

    if (AUTH.user()) {
      let selected = me ? me.rating : 0;
      const starEls = Array.from(document.querySelectorAll('#starInput .st'));
      const paint = (n)=> starEls.forEach(s=> s.classList.toggle('on', parseInt(s.dataset.v,10)<=n));
      paint(selected);
      starEls.forEach(s=>{
        s.addEventListener('mouseover', ()=>paint(parseInt(s.dataset.v,10)));
        s.addEventListener('mouseleave', ()=>paint(selected));
        s.addEventListener('click', ()=>{ selected=parseInt(s.dataset.v,10); paint(selected); });
        s.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selected=parseInt(s.dataset.v,10); paint(selected);} });
      });
      if (me) $('rvBody').value = me.body || '';
      $('rvSubmit').addEventListener('click', async ()=>{
        const err=$('rvErr'); err.classList.add('hidden');
        if (!selected) { err.textContent='Please pick a star rating.'; err.classList.remove('hidden'); return; }
        const btn=$('rvSubmit'); btn.disabled=true; btn.textContent='Saving…';
        const res = await AUTH.upsertReview(bookId, selected, $('rvBody').value.trim());
        if (res.error) { btn.disabled=false; btn.textContent = me?'Update review':'Post review'; err.textContent='Could not save: '+res.error.message; err.classList.remove('hidden'); return; }
        renderReviews(book);
      });
      const del = $('rvDelete');
      if (del) del.addEventListener('click', async ()=>{
        if (!confirm('Delete your review?')) return;
        del.disabled=true;
        const res = await AUTH.deleteReview(bookId);
        if (res.error) { alert('Could not delete: '+res.error.message); del.disabled=false; return; }
        renderReviews(book);
      });
    }
  }
</script>
</body>
</html>
