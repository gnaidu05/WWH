<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My dashboard — Kitaab</title>
<meta name="description" content="Manage your Kitaab profile, books and events.">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23C9741A'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='white' font-family='Georgia'%3E%E0%A4%95%3C/text%3E%3C/svg%3E">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header" data-active=""></div>

<main id="main">
<section class="page-hero">
  <div class="wrap">
    <p class="eyebrow">Your space</p>
    <h1 id="greeting">My dashboard</h1>
    <p class="lead" id="subgreeting">Manage your profile, books and events.</p>
  </div>
</section>

<section class="section">
  <div class="wrap">

    <div id="gate" class="panel center" style="max-width:460px;margin:0 auto">
      <p class="muted">Checking your session…</p>
    </div>

    <div id="app" class="hidden">
      <!-- Profile editor -->
      <div class="panel" style="margin-bottom:26px">
        <h3 class="mt-0">👤 Your profile</h3>
        <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start">
          <div style="text-align:center">
            <div id="avatarPreview" class="avatar" style="width:96px;height:96px;font-size:2.2rem;margin:0 auto 10px"></div>
            <label class="btn btn--ghost btn--sm" style="cursor:pointer;margin:0">Change photo<input id="pAvatarFile" type="file" accept="image/*" style="display:none"></label>
          </div>
          <form id="profileForm" style="flex:1;min-width:280px">
            <div class="grid grid--2" style="gap:12px">
              <div class="field"><label for="pName">Full name</label><input id="pName" required></div>
              <div class="field"><label for="pRole">Role</label>
                <select id="pRole"><option>Author</option><option>Publisher</option><option>Distributor</option><option>Reviewer</option><option>Reader</option></select></div>
            </div>
            <div class="grid grid--2" style="gap:12px">
              <div class="field"><label for="pCity">City</label><input id="pCity" placeholder="Bengaluru"></div>
              <div class="field"><label for="pLang">Primary language</label>
                <select id="pLang"><option>English</option><option>Hindi</option><option>Tamil</option><option>Bengali</option><option>Kannada</option><option>Telugu</option><option>Malayalam</option><option>Marathi</option><option>Gujarati</option><option>Punjabi</option><option>Urdu</option><option>Other</option></select></div>
            </div>
            <div class="field"><label for="pOrg">Organisation <span class="muted">(publishers/distributors/reviewers)</span></label><input id="pOrg" placeholder="Peacock Press"></div>
            <div class="field"><label for="pBio">Bio</label><textarea id="pBio" rows="2" placeholder="Your genres, latest book, or the services you offer…"></textarea></div>
            <p id="profileMsg" class="hidden" style="font-weight:600;margin:0 0 10px"></p>
            <button class="btn btn--primary" type="submit" id="profileBtn">Save profile</button>
          </form>
        </div>
      </div>

      <div class="grid grid--2" style="align-items:start;gap:26px">

        <!-- Add a book -->
        <div>
          <div class="panel">
            <h3 class="mt-0" id="bookFormTitle">📖 List a new book</h3>
            <form id="bookForm">
              <div class="field"><label for="bTitle">Title</label><input id="bTitle" required placeholder="The Marigold Verses"></div>
              <div class="grid grid--2" style="gap:12px">
                <div class="field"><label for="bGenre">Genre</label>
                  <select id="bGenre"><option>Literary Fiction</option><option>Poetry</option><option>Mystery</option><option>Short Stories</option><option>Business</option><option>Memoir</option><option>Non-fiction</option><option>Historical</option><option>Children</option></select></div>
                <div class="field"><label for="bLang">Language</label>
                  <select id="bLang"><option>English</option><option>Hindi</option><option>Tamil</option><option>Bengali</option><option>Kannada</option><option>Telugu</option><option>Malayalam</option><option>Marathi</option><option>Other</option></select></div>
              </div>
              <div class="grid grid--2" style="gap:12px">
                <div class="field"><label for="bPrice">Price (₹)</label><input id="bPrice" type="number" min="0" value="299"></div>
                <div class="field"><label for="bIsbn">ISBN <span class="muted">(optional)</span></label><input id="bIsbn" placeholder="978-93-XXXXX-XX-X"></div>
              </div>
              <div class="field">
                <label>Marketplace / buy links <span class="muted">(optional — Amazon, Flipkart, and more)</span></label>
                <div id="buyUrls"></div>
                <button type="button" class="btn btn--ghost btn--sm" id="addBuyRow" style="margin-top:2px">+ Add another link</button>
              </div>
              <div class="field">
                <label for="bCoverFile">Book cover image <span class="muted">(optional — upload your real cover)</span></label>
                <input id="bCoverFile" type="file" accept="image/*">
                <p class="form-note" style="margin:6px 0 0">JPG or PNG, up to ~3&nbsp;MB. If you don't upload one, we'll use a colour cover:</p>
              </div>
              <div class="field"><label for="bCover">Fallback cover colour</label>
                <select id="bCover"><option value="0">Teal</option><option value="1">Maroon</option><option value="2">Saffron</option><option value="3">Indigo</option><option value="4">Green</option><option value="5">Plum</option></select></div>
              <div class="field"><label for="bDesc">Short description <span class="muted">(optional)</span></label><textarea id="bDesc" rows="2"></textarea></div>
              <p id="bookErr" class="hidden" style="color:var(--maroon);font-weight:600;margin:0 0 10px"></p>
              <div style="display:flex;gap:10px">
                <button class="btn btn--primary" style="flex:1" type="submit" id="bookBtn">Add book to marketplace</button>
                <button class="btn btn--ghost hidden" type="button" id="bookCancel">Cancel</button>
              </div>
            </form>
          </div>
          <h3 style="margin:26px 0 12px">Your books</h3>
          <div class="grid" id="myBooks" style="gap:14px"><p class="muted">Loading…</p></div>
        </div>

        <!-- Add an event -->
        <div>
          <div class="panel">
            <h3 class="mt-0">🎤 Host an engagement activity</h3>
            <form id="eventForm">
              <div class="field"><label for="eTitle">Title</label><input id="eTitle" required placeholder="Launch &amp; reading of my new book"></div>
              <div class="grid grid--2" style="gap:12px">
                <div class="field"><label for="eType">Type</label>
                  <select id="eType"><option>Book Launch</option><option>Reading</option><option>AMA</option><option>Workshop</option><option>Panel</option><option>Book Club</option></select></div>
                <div class="field"><label for="eDate">Date</label><input id="eDate" type="date" required></div>
              </div>
              <div class="grid grid--2" style="gap:12px">
                <div class="field"><label for="eTime">Time</label><input id="eTime" placeholder="6:30 PM"></div>
                <div class="field"><label for="eMode">Where</label><input id="eMode" placeholder="Bengaluru · In-person or Online"></div>
              </div>
              <div class="field"><label for="eDesc">Details <span class="muted">(optional)</span></label><textarea id="eDesc" rows="2"></textarea></div>
              <p id="eventErr" class="hidden" style="color:var(--maroon);font-weight:600;margin:0 0 10px"></p>
              <button class="btn btn--teal btn--block" type="submit" id="eventBtn">Announce event</button>
            </form>
          </div>
          <h3 style="margin:26px 0 12px">Your events</h3>
          <div class="grid" id="myEvents" style="gap:14px"><p class="muted">Loading…</p></div>
        </div>
      </div>
    </div>
  </div>
</section>
</main>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  const $ = (id) => document.getElementById(id);

  (async function () {
    const enabled = await AUTH.ready;
    const gate = $('gate');
    if (!enabled) {
      gate.innerHTML = '<h3 class="mt-0">Backend not connected</h3><p class="muted">The dashboard needs the Supabase keys in <code>assets/js/supabase-config.js</code>. See the README for the 5-minute setup.</p><a class="btn btn--ghost btn--sm" href="index.html">Back home</a>';
      return;
    }
    if (!AUTH.user()) {
      gate.innerHTML = '<h3 class="mt-0">Please sign in</h3><p class="muted">You need an account to access your dashboard.</p><div style="display:flex;gap:10px;justify-content:center"><a class="btn btn--primary btn--sm" href="signin.html">Sign in</a><a class="btn btn--ghost btn--sm" href="join.html">Join free</a></div>';
      return;
    }
    // Signed in
    const p = AUTH.profile() || {};
    const first = (p.full_name || 'there').split(' ')[0];
    $('greeting').textContent = `Welcome, ${first} 👋`;
    $('subgreeting').textContent = `Signed in as ${p.role || 'member'}${p.city ? ' · ' + p.city : ''}. Manage your books and events below.`;
    gate.classList.add('hidden');
    $('app').classList.remove('hidden');
    populateProfile();
    refreshBooks(); refreshEvents();
  })();

  // ---- Profile editor ----
  function renderAvatar(url, name) {
    const el = $('avatarPreview');
    if (url) { el.style.background = `url('${url}') center/cover no-repeat`; el.textContent = ''; }
    else { el.style.background = COVER_GRADS[0]; el.textContent = initials(name || 'You'); }
  }
  function populateProfile() {
    const p = AUTH.profile() || {};
    $('pName').value = p.full_name && p.full_name !== 'New member' ? p.full_name : '';
    $('pRole').value = p.role || 'Author';
    $('pCity').value = p.city || '';
    $('pLang').value = p.language || 'English';
    $('pOrg').value = p.org || '';
    $('pBio').value = p.bio || '';
    renderAvatar(p.avatar_url, p.full_name);
  }
  function showProfileMsg(t, err) { const m = $('profileMsg'); m.textContent = t; m.style.color = err ? 'var(--maroon)' : 'var(--teal)'; m.classList.remove('hidden'); }

  $('pAvatarFile').addEventListener('change', function (e) {
    const f = e.target.files[0]; if (!f) return;
    $('avatarPreview').style.background = `url('${URL.createObjectURL(f)}') center/cover no-repeat`;
    $('avatarPreview').textContent = '';
  });

  $('profileForm').addEventListener('submit', async function (e) {
    e.preventDefault(); $('profileMsg').classList.add('hidden');
    const btn = $('profileBtn'); btn.disabled = true;
    let avatar_url;
    const f = $('pAvatarFile').files[0];
    if (f) {
      if (f.size > 3.5 * 1024 * 1024) { showProfileMsg('That image is over ~3 MB — pick a smaller one.', true); btn.disabled = false; btn.textContent = 'Save profile'; return; }
      btn.textContent = 'Uploading photo…';
      const up = await AUTH.uploadAvatar(f);
      if (up.error) { showProfileMsg('Photo upload failed: ' + up.error.message, true); btn.disabled = false; btn.textContent = 'Save profile'; return; }
      avatar_url = up.url;
    }
    btn.textContent = 'Saving…';
    const fields = { full_name: $('pName').value.trim() || 'New member', role: $('pRole').value, city: $('pCity').value.trim(), language: $('pLang').value, org: $('pOrg').value.trim(), bio: $('pBio').value.trim() };
    if (avatar_url) fields.avatar_url = avatar_url;
    const res = await AUTH.updateProfile(fields);
    btn.disabled = false; btn.textContent = 'Save profile';
    if (res.error) { showProfileMsg('Could not save: ' + res.error.message, true); return; }
    showProfileMsg('Profile saved ✓', false);
    const pr = AUTH.profile() || {};
    $('greeting').textContent = `Welcome, ${(pr.full_name || 'there').split(' ')[0]} 👋`;
    $('subgreeting').textContent = `Signed in as ${pr.role || 'member'}${pr.city ? ' · ' + pr.city : ''}. Manage your books and events below.`;
    renderAvatar(pr.avatar_url, pr.full_name);
    refreshBooks(); // author_name on new books uses the updated profile
  })

  let myBooksData = [];
  function bookBuyUrls(b) { return (b.buy_urls && b.buy_urls.length) ? b.buy_urls : (b.buy_url ? [b.buy_url] : []); }

  async function refreshBooks() {
    const rows = await AUTH.myBooks();
    myBooksData = rows;
    $('myBooks').innerHTML = rows.length
      ? rows.map(b => `<div class="dash-book">${KALAM.bookCard({ title:b.title, author:b.author_name, genre:b.genre, lang:b.language, price:b.price, rating:5, cover:b.cover_idx||0, coverUrl:b.cover_url||null, isbn:b.isbn||null, buyUrls:bookBuyUrls(b) })}<div class="dash-book__actions"><button class="btn btn--ghost btn--sm" data-edit="${b.id}">✏️ Edit</button><button class="btn btn--ghost btn--sm" data-del="${b.id}">🗑 Delete</button></div></div>`).join('')
      : '<p class="muted">No books yet — add your first one on the left.</p>';
  }

  // Edit / delete actions on your books
  $('myBooks').addEventListener('click', async function (e) {
    const ed = e.target.closest('[data-edit]'); const del = e.target.closest('[data-del]');
    if (ed) { startEditBook(ed.getAttribute('data-edit')); }
    else if (del) {
      const id = del.getAttribute('data-del');
      const bk = myBooksData.find(x => x.id === id);
      if (confirm(`Delete "${bk ? bk.title : 'this book'}"? This can't be undone.`)) {
        del.disabled = true;
        const res = await AUTH.deleteBook(id);
        if (res.error) { alert('Could not delete: ' + res.error.message); del.disabled = false; return; }
        if (editingBookId === id) resetBookForm();
        refreshBooks();
      }
    }
  });

  // ---- Buy-URL rows ----
  function addBuyRow(value) {
    const wrap = document.createElement('div');
    wrap.className = 'buy-row';
    wrap.innerHTML = `<input type="url" class="buy-url-input" placeholder="https://www.amazon.in/dp/…"><button type="button" class="buy-row__rm" title="Remove">×</button>`;
    wrap.querySelector('input').value = value || '';
    wrap.querySelector('.buy-row__rm').addEventListener('click', () => {
      wrap.remove();
      if (!$('buyUrls').querySelector('.buy-row')) addBuyRow('');
    });
    $('buyUrls').appendChild(wrap);
  }
  function setBuyRows(list) {
    $('buyUrls').innerHTML = '';
    (list && list.length ? list : ['']).forEach(v => addBuyRow(v));
  }
  function collectBuyUrls() {
    return Array.from(document.querySelectorAll('.buy-url-input')).map(i => i.value.trim()).filter(Boolean);
  }
  $('addBuyRow').addEventListener('click', () => addBuyRow(''));
  setBuyRows([]);

  // ---- Add / edit mode ----
  let editingBookId = null;
  function resetBookForm() {
    editingBookId = null;
    $('bookForm').reset();
    setBuyRows([]);
    $('bookFormTitle').textContent = '📖 List a new book';
    $('bookBtn').textContent = 'Add book to marketplace';
    $('bookCancel').classList.add('hidden');
    $('bookErr').classList.add('hidden');
  }
  $('bookCancel').addEventListener('click', resetBookForm);

  function startEditBook(id) {
    const b = myBooksData.find(x => x.id === id);
    if (!b) return;
    editingBookId = id;
    $('bTitle').value = b.title || '';
    $('bGenre').value = b.genre || 'Literary Fiction';
    $('bLang').value = b.language || 'English';
    $('bPrice').value = b.price != null ? b.price : 0;
    $('bIsbn').value = b.isbn || '';
    $('bCover').value = String(b.cover_idx || 0);
    $('bDesc').value = b.description || '';
    setBuyRows(bookBuyUrls(b));
    $('bCoverFile').value = '';
    $('bookFormTitle').textContent = '✏️ Edit book';
    $('bookBtn').textContent = 'Save changes';
    $('bookCancel').classList.remove('hidden');
    $('bookErr').classList.add('hidden');
    document.querySelector('#bookForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  async function refreshEvents() {
    const rows = await AUTH.myEvents();
    const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    $('myEvents').innerHTML = rows.length
      ? rows.map(r => { const d = new Date(r.event_date+'T00:00:00');
          return KALAM.eventCard({ day:String(d.getDate()).padStart(2,'0'), month:MON[d.getMonth()]||'', type:r.type, title:r.title, author:r.host_name, mode:r.mode||'Online', time:r.event_time||'' }); }).join('')
      : '<p class="muted">No events yet — announce one on the left.</p>';
  }

  $('bookForm').addEventListener('submit', async function (e) {
    e.preventDefault(); $('bookErr').classList.add('hidden');
    const editing = editingBookId;
    const btn = $('bookBtn'); btn.disabled = true;
    const defaultLabel = editing ? 'Save changes' : 'Add book to marketplace';

    // Upload cover image first, if a new one was chosen.
    let cover_url = null;
    const file = $('bCoverFile').files[0];
    if (file) {
      if (file.size > 3.5 * 1024 * 1024) { showBookErr('That image is over ~3 MB — please pick a smaller one.'); btn.disabled = false; btn.textContent = defaultLabel; return; }
      btn.textContent = 'Uploading cover…';
      const up = await AUTH.uploadCover(file);
      if (up.error) { showBookErr('Cover upload failed: ' + up.error.message); btn.disabled = false; btn.textContent = defaultLabel; return; }
      cover_url = up.url;
    }

    const fields = {
      title:$('bTitle').value.trim(), genre:$('bGenre').value, language:$('bLang').value,
      price:$('bPrice').value, cover_idx:$('bCover').value, isbn:$('bIsbn').value.trim(),
      buy_urls: collectBuyUrls(), cover_url, description:$('bDesc').value.trim(),
    };
    btn.textContent = editing ? 'Saving…' : 'Adding…';
    const res = editing ? await AUTH.updateBook(editing, fields) : await AUTH.addBook(fields);
    btn.disabled = false; btn.textContent = defaultLabel;
    if (res.error) { showBookErr('Could not save: ' + res.error.message); return; }
    resetBookForm(); refreshBooks();
  });
  function showBookErr(msg){ $('bookErr').textContent = msg; $('bookErr').classList.remove('hidden'); }

  $('eventForm').addEventListener('submit', async function (e) {
    e.preventDefault(); $('eventErr').classList.add('hidden');
    const btn = $('eventBtn'); btn.disabled = true; btn.textContent = 'Announcing…';
    const res = await AUTH.addEvent({ title:$('eTitle').value.trim(), type:$('eType').value, event_date:$('eDate').value, event_time:$('eTime').value.trim(), mode:$('eMode').value.trim(), description:$('eDesc').value.trim() });
    btn.disabled = false; btn.textContent = 'Announce event';
    if (res.error) { $('eventErr').textContent = 'Could not add: ' + res.error.message; $('eventErr').classList.remove('hidden'); return; }
    e.target.reset(); refreshEvents();
  });
</script>
</body>
</html>
