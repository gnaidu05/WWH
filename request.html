<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a quote — Kitaab</title>
<meta name="description" content="Request a quotation from a Kitaab partner.">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23C9741A'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='white' font-family='Georgia'%3E%E0%A4%95%3C/text%3E%3C/svg%3E">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header" data-active="partners"></div>

<main id="main">
<section class="page-hero">
  <div class="wrap">
    <p class="eyebrow">Partner services</p>
    <h1>Request a quote</h1>
  </div>
</section>

<section class="section">
  <div class="wrap" style="max-width:640px">
    <div id="reqApp"><p class="muted">Loading…</p></div>
  </div>
</section>
</main>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const quoteId = new URLSearchParams(location.search).get("quote");

  function fail(msg) {
    $('reqApp').innerHTML = `<div class="panel center"><h2 class="mt-0">${msg}</h2>
      <a class="btn btn--primary btn--sm" href="partners.html">Back to partners</a></div>`;
  }

  (async function () {
    const enabled = await AUTH.ready;
    if (!enabled) { fail("Backend not connected"); return; }
    if (!quoteId) { fail("No quotation specified"); return; }
    const q = await AUTH.getQuote(quoteId);
    if (!q) { fail("Quotation not found"); return; }

    const u = AUTH.user && AUTH.user();
    const p = AUTH.profile && AUTH.profile();
    const items = (q.items || []).map(i => `<li>${esc(i)}</li>`).join("");

    $('reqApp').innerHTML = `
      <div class="panel" style="margin-bottom:22px">
        <div class="quote-card__head">
          <div class="quote-card__logo" style="background:${COVER_GRADS[0]}">${esc(initials(q.partner_name))}</div>
          <div><strong>${esc(q.partner_name)}</strong><br><span class="badge ${q.kind === 'Reviewer' ? 'teal' : ''}">${esc(q.kind)}</span></div>
        </div>
        ${q.title ? `<div class="quote-card__title" style="margin-top:10px">${esc(q.title)}</div>` : ""}
        <div style="margin-top:4px"><span class="quote-card__price">${esc(q.price || "—")}</span> ${q.unit ? `<span class="muted">/ ${esc(q.unit)}</span>` : ""}</div>
        ${items ? `<ul class="quote-card__list" style="margin-top:8px">${items}</ul>` : ""}
      </div>

      <form class="panel" id="reqForm" novalidate>
        <h3 class="mt-0">Your request</h3>
        <div class="grid grid--2" style="gap:16px">
          <div class="field"><label for="rName">Your name</label><input id="rName" type="text" required value="${esc(p && p.full_name || "")}"></div>
          <div class="field"><label for="rEmail">Email</label><input id="rEmail" type="email" required value="${esc(u && u.email || "")}" placeholder="you@example.com"></div>
        </div>
        <div class="field"><label for="rMsg">Message to ${esc(q.partner_name)}</label><textarea id="rMsg" rows="4" placeholder="Tell them about your book and what you need…"></textarea></div>
        <p id="rErr" class="hidden" style="color:var(--maroon);font-weight:600;margin:0 0 12px"></p>
        <button class="btn btn--primary btn--block" type="submit" id="rBtn">Send request to ${esc(q.partner_name)}</button>
        <p class="form-note" style="text-align:center;margin:12px 0 0">Your request goes straight to this partner's dashboard. They'll reply to your email.</p>
      </form>

      <div class="panel hidden center" id="reqOk">
        <div class="card__icon" style="margin:0 auto 14px;width:56px;height:56px;font-size:1.7rem">✅</div>
        <h2>Request sent!</h2>
        <p class="muted">${esc(q.partner_name)} has received your request and will reply to your email.</p>
        <a class="btn btn--ghost" href="partners.html">Back to partners</a>
      </div>`;

    $('reqForm').addEventListener('submit', async function (e) {
      e.preventDefault(); $('rErr').classList.add('hidden');
      const name = $('rName').value.trim(), email = $('rEmail').value.trim(), message = $('rMsg').value.trim();
      if (!name || !email) { $('rErr').textContent = 'Please add your name and email.'; $('rErr').classList.remove('hidden'); return; }
      const btn = $('rBtn'); btn.disabled = true; btn.textContent = 'Sending…';
      const res = await AUTH.addQuoteRequest({
        quote_id: q.id, partner_id: q.partner_id, quote_title: q.title,
        requester_name: name, requester_email: email, message,
      });
      btn.disabled = false; btn.textContent = `Send request to ${q.partner_name}`;
      if (res.error) { $('rErr').textContent = 'Could not send: ' + res.error.message; $('rErr').classList.remove('hidden'); return; }
      $('reqForm').classList.add('hidden');
      $('reqOk').classList.remove('hidden');
      $('reqOk').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  })();
</script>
</body>
</html>
